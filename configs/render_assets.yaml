# Configuration file for using assets from /media/wxm/8dbeb4d4-8607-492e-981e-1309047cc361/codes_work/assets
# This config uses:
# - HDRIs from assets/hdri/
# - 3D models from assets/objaverse_lvis/
# - PBR textures from assets/pbr/

# 3D Model Assets
base_path: /media/wxm/8dbeb4d4-8607-492e-981e-1309047cc361/codes_work/assets/objaverse_lvis
baseshape_path: data/basicshapes  # Keep using existing basic shapes or set to None

# Environment Maps (HDRI)
envlight: /media/wxm/8dbeb4d4-8607-492e-981e-1309047cc361/codes_work/assets/hdri
env_scale: 1.0

# Ground Plane (keep using existing or create new)
placement_plane: data/plane_basic/plane.glb

# PBR Textures for Ground Plane
placement_plane_textures: /media/wxm/8dbeb4d4-8607-492e-981e-1309047cc361/codes_work/assets/pbr
texture_sample_weight: null  # Optional: {"wood": 2.0, "brick": 1.5} to bias sampling

# Rendering Settings
num_frames: 8
resolution: [512, 512]
spp: 64
use_denoise: OPTIX
bg_color: [0, 0, 0]
dump_alpha: true
dump_envmap: true
dump_ball_env: true
dump_env_bg: false
transparent_bg: true

# Lighting Settings
num_lighting: 2
random_env_rotation: true
random_env_flip: true
random_env_scale: [0.7, 1.4]

# Video Mode
video_mode: orbit_cam
num_rendering: 10
num_scenes: 2  # Number of scene variants to render with same layout (0 means disabled)

# Camera Settings
cam_phi_range: [60, 120]
cam_theta_range: [5, 50]
cam_t_range: [-0.1, 0.1]
fov_range: [45, 50]
radius_range: [2.5, 3.5]

# Object Placement Settings
glbs_per_scene: 2
glbs_scale_range: [1.0, 1.3]
glbs_rotation_range: [-45, 45]
glbs_placement_bbox: [-1.0, -1.0, 1.0, 1.0]
glbs_rescale: true

# Basic Shapes Settings
shapes_per_scene: 3
shapes_scale_range: [0.3, 0.8]
shapes_rotation_range: [0, 360]
shapes_placement_bbox: [-1.5, -1.5, 1.5, 1.5]
sample_shape_texture: true

# Placement Grid Settings
placement_bbox: [-1.5, -1.5, 1.5, 1.5]
placement_grid_res: [40, 40]
placement_bbox_scale: 1.1
placement_plane_offset: [0, 0, -0.5]
placement_plane_scale: 10

# Output Settings
dump_complete: false
dump_blend: false
dump_video: true
dump_format: jpg

